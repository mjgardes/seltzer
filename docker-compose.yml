version: '3.8'
services:
  nginx:
    build: ./nginx/
    container_name: nginx-container
    ports:
      - 80:80
    links:
      - php
    volumes_from:
      - app-data

  php:
    build: ./php/
    container_name: php-container
    expose:
      - 9000
    links:
      - mysql
    volumes_from:
      - app-data

  app-data:
    image: php:7.4-fpm
    container_name: app-data-container
    volumes:
      - ./crm/:/var/www/html/
    command: "true"

  mysql:
    image: mariadb:10.1.45
    container_name: mysql-container
    ports:
      - 3306:3306
    volumes_from:
      - mysql-data
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: mydb
      MYSQL_USER: myuser
      MYSQL_PASSWORD: password

  mysql-data:
    image: mariadb:10.1.45
    container_name: mysql-data-container
    volumes:
      - /var/lib/mysql
    command: "true"